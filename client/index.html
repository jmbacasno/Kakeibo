<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kakeibo — Mindful Personal Finance</title>
    <meta name="description" content="A Japanese Kakeibo-inspired personal finance journal for monthly planning, expense tracking, budgeting, notes, and mindful spending reflections." />
    <meta property="og:title" content="Kakeibo — Mindful Personal Finance" />
    <meta property="og:description" content="A Japanese Kakeibo-inspired personal finance journal for monthly planning, expense tracking, budgeting, notes, and mindful spending reflections." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet" />
    <script>
      try {
        var t = localStorage.getItem('kakeibo_theme');
        if (t !== 'system' && t !== 'light' && t !== 'dark') t = 'system';
        var resolved =
          t === 'system'
            ? window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : t;
        document.documentElement.setAttribute('data-theme', resolved);
      } catch (e) {}
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
